name: Tugboat Yards
description: Tugboat Yards Inc. was a San Francisco startup (product name "Tugboat")
  that built tools for independent publishers and media creators to raise direct
  financial support from their audiences, and was backed by a16z. The company is
  defunct - the product was live circa 2012-2014, the tugboatyards.com domain was
  reduced to a registrar parking page by 2016, and as of July 2026 the domain
  publishes no A/AAAA records. It did operate a real, documented publisher API at
  api.tugboatyards.com (key-check, pages, offers, subscribers, orders, checkout
  configuration, placements, and Instant Payment Notification webhooks) with a
  first-party Python client, pytugboat. That surface is offline; the artifacts in
  this repository are a historical record recovered from the provider's own 2015
  documentation via the Wayback Machine and from the still-live pytugboat docs on
  Read the Docs. This profile is preserved as part of the a16z venture-portfolio
  graph in the API Evangelist network.
